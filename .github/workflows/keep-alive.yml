# Supabase pauses free projects after a week without traffic. This pings it twice a week.
name: Keep Supabase awake
on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/?apikey=${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
